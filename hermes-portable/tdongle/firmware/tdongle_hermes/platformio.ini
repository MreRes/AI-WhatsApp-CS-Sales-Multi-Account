; Hermes Portable — T-Dongle-S3 firmware (PlatformIO build)
; Alternative to the Arduino IDE. Build + upload:
;   pio run -t upload
;
; Board: LilyGO T-Dongle-S3 (ESP32-S3, native USB OTG / TinyUSB).

[env:tdongle-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Native USB as HID keyboard (TinyUSB), CDC-on-boot disabled so we own the USB.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0

; T-Dongle-S3 has 16MB flash.
board_build.flash_mode = qio
board_upload.flash_size = 16MB

monitor_speed = 115200
